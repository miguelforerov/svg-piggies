        product:
          $ref: "#/components/schemas/Product"

    ProductCollection:
      type: object
      required: [productId, collectionId]
      properties:
        productId:
          type: string
          format: uuid
        collectionId:
          type: string
          format: uuid

    CreateProductCollectionInput:
      type: object
      required: [collectionId]
      properties:
        collectionId:
          type: string
          format: uuid

    ProductProductType:
      type: object
      required: [productId, productTypeId]
      properties:
        productId:
          type: string
          format: uuid
        productTypeId:
          type: string
          format: uuid

    CreateProductProductTypeInput:
      type: object
      required: [productTypeId]
      properties:
        productTypeId:
          type: string
          format: uuid

    ProductType:
      type: object
      required: [id, name, slug, description]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string

    CreateProductTypeInput:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        description:
          type: string
          default: ""

    UpdateProductTypeInput:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        description:
          type: string
          default: ""

    Error:
