components:
  securitySchemes:
    CloudflareAccess:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: Cloudflare Access application JWT, validated using the team JWKS.

  parameters:
    CollectionId:
      name: collectionId
      in: path
      required: true
      description: Collection UUID.
      schema:
        type: string
        format: uuid
    ProductId:
      name: productId
      in: path
      required: true
      description: Product UUID.
      schema:
        type: string
        format: uuid
    ProductTypeId:
      name: productTypeId
      in: path
      required: true
      description: Product type UUID.
      schema:
        type: string
        format: uuid
    RelationshipId:
      name: relationshipId
      in: path
      required: true
      description: Product relationship UUID.
      schema:
        type: string
        format: uuid
    CartToken:
      name: X-Cart-Token
      in: header
      required: true
      description: Opaque guest-cart token returned when the cart is created.
      schema:
        type: string
        minLength: 20
    CustomerId:
      name: customerId
      in: path
      required: true
      description: Customer UUID.
      schema:
        type: string
        format: uuid
    OrderId:
      name: orderId
      in: path
      required: true
      description: Order UUID.
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Cloudflare Access authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The authenticated user does not have administrator permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The requested change conflicts with an existing record.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Gone:
      description: The image upload authorization has expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: The server could not complete the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: The storage service could not complete the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: Image uploads are temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [environment, status]
      properties:
        environment:
          type: string
        status:
          type: string
          enum: [ok]

    CartStatus:
      type: string
      enum: [active]

    CartItem:
      type: object
      required:
        - id
        - productId
        - name
        - slug
        - price
        - quantity
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        price:
          type: string
          pattern: '^(0|[0-9]{1,10})(\.[0-9]{1,2})?$'
          example: "19.95"
        quantity:
          type: integer
          minimum: 1
          maximum: 99
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    Cart:
      type: object
      required: [id, status, currency, items, createdAt, updatedAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/CartStatus"
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: aud
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        expiresAt:
          type: string
          format: date-time
          readOnly: true

    CreatedCart:
      type: object
      required: [token, cart]
      properties:
        token:
          type: string
          minLength: 20
          writeOnly: true
        cart:
          $ref: "#/components/schemas/Cart"

    AddCartItemInput:
      type: object
      required: [productId]
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          default: 1

    UpdateCartItemInput:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 99

    CheckoutCustomerInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string

    Customer:
      type: object
      required: [id, email, marketingConsent, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        stripeCustomerId:
          type: string
          nullable: true
          readOnly: true
        authUserId:
          type: string
          nullable: true
          readOnly: true
        marketingConsent:
          type: boolean
        marketingConsentAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    CreateCustomerInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        marketingConsent:
          type: boolean
          default: false

    UpdateCustomerInput:
      type: object
      required: [email, marketingConsent]
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        marketingConsent:
          type: boolean

    OrderStatus:
      type: string
      enum: [pending, fulfilled, cancelled]

    PaymentStatus:
      type: string
      enum: [unpaid, processing, paid, failed, partially_refunded, refunded]

    OrderItem:
      type: object
      required:
        - id
        - orderId
        - productId
        - productName
        - quantity
        - unitPriceAmount
        - lineTotalAmount
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        productName:
          type: string
        variantName:
          type: string
          nullable: true
        sku:
          type: string
          nullable: true
        quantity:
          type: integer
          minimum: 1
        unitPriceAmount:
          type: integer
          format: int64
          minimum: 0
          description: Unit price in the currency's smallest unit (cents for AUD).
        lineTotalAmount:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          type: string
          format: date-time
          readOnly: true

    Order:
      type: object
      required:
        - id
        - customerEmail
        - orderStatus
        - paymentStatus
        - currency
        - subtotalAmount
        - discountAmount
        - taxAmount
        - totalAmount
        - amountRefunded
        - items
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
          nullable: true
        customerEmail:
          type: string
          format: email
        orderStatus:
          $ref: "#/components/schemas/OrderStatus"
        paymentStatus:
          $ref: "#/components/schemas/PaymentStatus"
        currency:
          type: string
          minLength: 3
          maxLength: 3
        subtotalAmount:
          type: integer
          format: int64
        discountAmount:
          type: integer
          format: int64
        taxAmount:
          type: integer
          format: int64
        totalAmount:
          type: integer
          format: int64
        amountRefunded:
          type: integer
          format: int64
        stripeCheckoutSessionId:
          type: string
          nullable: true
          readOnly: true
        stripePaymentIntentId:
          type: string
          nullable: true
          readOnly: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        paidAt:
          type: string
          format: date-time
          nullable: true
        fulfilledAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true

    UpdateOrderInput:
      type: object
      required: [orderStatus]
      properties:
        orderStatus:
          $ref: "#/components/schemas/OrderStatus"

    Collection:
      type: object
      required: [id, name, slug, description]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string

    CreateCollectionInput:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        description:
          type: string
          default: ""

    UpdateCollectionInput:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        description:
          type: string
          default: ""

    ProductStatus:
      type: string
      enum: [draft, active, archived]

    Product:
      type: object
      required: [id, title, slug, description, price, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        price:
          type: string
          pattern: '^(0|[0-9]{1,10})(\.[0-9]{1,2})?$'
          example: "19.95"
        status:
          $ref: "#/components/schemas/ProductStatus"
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    CreateProductInput:
      type: object
      required: [title, slug, price]
      properties:
        title:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        description:
          type: string
          default: ""
        price:
          type: string
          pattern: '^(0|[0-9]{1,10})(\.[0-9]{1,2})?$'
          example: "19.95"
        status:
          allOf:
            - $ref: "#/components/schemas/ProductStatus"
          default: draft

    UpdateProductInput:
      type: object
      required: [title, slug, price, status]
      properties:
        title:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        description:
          type: string
          default: ""
        price:
          type: string
          pattern: '^(0|[0-9]{1,10})(\.[0-9]{1,2})?$'
          example: "19.95"
        status:
          $ref: "#/components/schemas/ProductStatus"

    ProductImage:
      type: object
      required:
        - id
        - productId
        - r2ObjectKey
        - originalFilename
        - contentType
        - fileSizeBytes
        - displayOrder
        - isPrimary
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        r2ObjectKey:
          type: string
        originalFilename:
          type: string
        contentType:
          type: string
        fileSizeBytes:
          type: integer
          format: int64
          minimum: 0
        widthPx:
          type: integer
          minimum: 1
          nullable: true
        heightPx:
          type: integer
          minimum: 1
          nullable: true
        altText:
          type: string
          nullable: true
        displayOrder:
          type: integer
          minimum: 0
        isPrimary:
          type: boolean
        r2Etag:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    RequestProductImageUploadInput:
      type: object
      required: [originalFilename, contentType, fileSizeBytes]
      properties:
        originalFilename:
          type: string
          minLength: 1
          maxLength: 255
        contentType:
          type: string
          enum: [image/png, image/jpeg, image/webp]
        fileSizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 10485760

    ProductImageUploadAuthorization:
      type: object
      required: [uploadToken, objectKey, uploadUrl, headers, expiresAt]
      properties:
        uploadToken:
          type: string
        objectKey:
          type: string
        uploadUrl:
          type: string
          format: uri
        headers:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        expiresAt:
          type: string
          format: date-time

    ConfirmProductImageUploadInput:
      type: object
      required: [uploadToken]
      properties:
        uploadToken:
          type: string
        altText:
          type: string
        displayOrder:
          type: integer
          minimum: 0
          default: 0
        isPrimary:
          type: boolean
          default: false

    ProductRelationship:
      type: object
      required: [id, productId, relatedProductId, displayOrder]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        relatedProductId:
          type: string
          format: uuid
        displayOrder:
          type: integer
          minimum: 0

    CreateProductRelationshipInput:
      type: object
      required: [relatedProductId]
      properties:
        relatedProductId:
          type: string
          format: uuid
        displayOrder:
          type: integer
          minimum: 0
          default: 0

    CreateProductRelationshipsInput:
      type: object
      required: [relatedProductIds]
      properties:
        relatedProductIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid

    UpdateProductRelationshipInput:
      type: object
      required: [relatedProductId, displayOrder]
      properties:
        relatedProductId:
