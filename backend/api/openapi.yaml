openapi: 3.0.3
info:
  title: SVG Piggies API
  version: 0.1.0
  description: API contract for the SVG Piggies storefront and admin application.
servers:
  - url: /
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Check API health
      tags: [system]
      security: []
      responses:
        "200":
          description: The API process is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/cart:
    post:
      operationId: createCart
      summary: Create a guest cart
      tags: [cart]
      security: []
      responses:
        "201":
          description: Guest cart created. The token is returned only to the client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedCart"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      operationId: getCart
      summary: Get the current guest cart
      tags: [cart]
      security: []
      parameters:
        - $ref: "#/components/parameters/CartToken"
      responses:
        "200":
          description: Current cart and its items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      operationId: clearCart
      summary: Remove every item from the current guest cart
      tags: [cart]
      security: []
      parameters:
        - $ref: "#/components/parameters/CartToken"
      responses:
        "204":
          description: Cart cleared.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/cart/items:
    post:
      operationId: addCartItem
      summary: Add a product to the current guest cart
      tags: [cart]
      security: []
      parameters:
        - $ref: "#/components/parameters/CartToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCartItemInput"
      responses:
        "200":
          description: Updated cart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/cart/items/{productId}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
      - $ref: "#/components/parameters/CartToken"
    put:
      operationId: updateCartItem
      summary: Set a product's quantity in the current guest cart
      tags: [cart]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCartItemInput"
      responses:
        "200":
          description: Updated cart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      operationId: deleteCartItem
      summary: Remove a product from the current guest cart
      tags: [cart]
      security: []
      responses:
        "200":
          description: Updated cart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/checkout/orders:
    post:
      operationId: createCheckoutOrder
      summary: Create a pending order from the current guest cart
      description: >-
        Prices and order items are copied from the database, never accepted from
        the browser. The customer is created or matched by email and the cart is
        converted atomically. Stripe Checkout is attached in the payment step.
      tags: [checkout]
      security: []
      parameters:
        - $ref: "#/components/parameters/CartToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutCustomerInput"
      responses:
        "201":
          description: Pending order created from the cart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/products/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        description: Product slug.
        schema:
          type: string
    get:
      operationId: getProductBySlug
      summary: Get a product by slug
      tags: [products]
      responses:
        "200":
          description: Product found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/collections/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getCollectionBySlug
      summary: Get a collection by slug
      tags: [collections]
      responses:
        "200":
          description: Collection found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/product-types/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        description: Product type slug.
        schema:
          type: string
    get:
      operationId: getProductTypeBySlug
      summary: Get a product type by slug
      tags: [product-types]
      responses:
        "200":
          description: Product type found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductType"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/collections:
    get:
      operationId: getCollections
      summary: List collections
      tags: [admin-collections]
      security:
        - CloudflareAccess: []
      responses:
        "200":
          description: Collections ordered by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Collection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: createCollection
      summary: Create a collection
      tags: [admin-collections]
      security:
        - CloudflareAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCollectionInput"
      responses:
        "201":
          description: Collection created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/customers:
    get:
      operationId: getCustomers
      summary: List customers
      tags: [admin-customers]
      security:
        - CloudflareAccess: []
      responses:
        "200":
          description: Customers ordered by creation date, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: createCustomer
      summary: Create a customer
      tags: [admin-customers]
      security:
        - CloudflareAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerInput"
      responses:
        "201":
          description: Customer created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/customers/{customerId}:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    get:
      operationId: getCustomer
      summary: Get a customer
      tags: [admin-customers]
      security:
        - CloudflareAccess: []
      responses:
        "200":
          description: Customer found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      operationId: updateCustomer
      summary: Replace editable customer details
      tags: [admin-customers]
      security:
        - CloudflareAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerInput"
      responses:
        "200":
          description: Customer updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      operationId: deleteCustomer
      summary: Delete a customer profile while preserving order snapshots
      tags: [admin-customers]
      security:
        - CloudflareAccess: []
      responses:
        "204":
          description: Customer deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/orders:
    get:
      operationId: getOrders
      summary: List orders with their immutable line-item snapshots
      tags: [admin-orders]
      security:
        - CloudflareAccess: []
      responses:
        "200":
          description: Orders ordered by creation date, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/orders/{orderId}:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    get:
      operationId: getOrder
      summary: Get an order and its items
      tags: [admin-orders]
      security:
        - CloudflareAccess: []
      responses:
        "200":
          description: Order found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      operationId: updateOrder
      summary: Update the fulfilment or cancellation state of an order
      description: Payment state is intentionally excluded and may only be changed by verified Stripe events.
      tags: [admin-orders]
      security:
        - CloudflareAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderInput"
      responses:
        "200":
          description: Order updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/admin/collections/{collectionId}:
    parameters:
      - $ref: "#/components/parameters/CollectionId"
    get:
      operationId: getCollection
      summary: Get a collection
      tags: [admin-collections]
      security:
        - CloudflareAccess: []
      responses:
        "200":
          description: Collection found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      operationId: updateCollection
      summary: Replace a collection
      tags: [admin-collections]
      security:
        - CloudflareAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCollectionInput"
      responses:
        "200":
          description: Collection updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      operationId: deleteCollection
      summary: Delete a collection
      tags: [admin-collections]
      security:
        - CloudflareAccess: []
      responses:
        "204":
          description: Collection deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/products:
    get:
      operationId: getProducts
      summary: List products
      tags: [admin-products]
      security:
        - CloudflareAccess: []
      responses:
        "200":
          description: Products ordered by creation date, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: createProduct
      summary: Create a product
      tags: [admin-products]
      security:
        - CloudflareAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductInput"
      responses:
        "201":
          description: Product created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/products/{productId}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      operationId: getProduct
      summary: Get a product
      tags: [admin-products]
      security:
        - CloudflareAccess: []
      responses:
        "200":
          description: Product found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      operationId: updateProduct
      summary: Replace a product
      tags: [admin-products]
      security:
        - CloudflareAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductInput"
      responses:
        "200":
          description: Product updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      operationId: deleteProduct
      summary: Delete a product
      tags: [admin-products]
      security:
        - CloudflareAccess: []
      responses:
        "204":
          description: Product deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/products/{productId}/relationships:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      operationId: getProductRelationships
      summary: List a product's related products
      tags: [admin-product-relationships]
      security:
        - CloudflareAccess: []
      responses:
        "200":
          description: Product relationships ordered by display order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductRelationship"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: createProductRelationship
      summary: Add a related product
      tags: [admin-product-relationships]
      security:
        - CloudflareAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRelationshipInput"
      responses:
        "201":
          description: Product relationship created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductRelationship"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      operationId: replaceProductRelationships
      summary: Replace all related products selected for a product
      tags: [admin-product-relationships]
      security:
        - CloudflareAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceProductRelationshipsInput"
      responses:
        "200":
          description: Relationships replaced and populated product returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductWithRelationships"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/products/{productId}/images:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    post:
      operationId: confirmProductImageUpload
      summary: Confirm a product image upload and register verified metadata
      tags: [admin-product-images]
      security:
        - CloudflareAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmProductImageUploadInput"
      responses:
        "201":
          description: Product image confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /api/admin/products/{productId}/images/uploads:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    post:
      operationId: requestProductImageUpload
      summary: Request a direct R2 upload for a product image
      tags: [admin-product-images]
      security:
        - CloudflareAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestProductImageUploadInput"
      responses:
        "201":
          description: Upload authorization created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImageUploadAuthorization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/admin/products/{productId}/relationships/bulk:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    post:
      operationId: createProductRelationships
      summary: Add one or more related products, ignoring existing relationships
      tags: [admin-product-relationships]
      security:
        - CloudflareAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRelationshipsInput"
      responses:
        "200":
          description: Relationships added and populated product returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductWithRelationships"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/products/{productId}/relationships/{relationshipId}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
      - $ref: "#/components/parameters/RelationshipId"
    get:
      operationId: getProductRelationship
      summary: Get a product relationship
      tags: [admin-product-relationships]
      security:
        - CloudflareAccess: []
      responses:
        "200":
          description: Product relationship found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductRelationship"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      operationId: updateProductRelationship
