openapi: 3.0.3
info:
  title: SVG Piggies API
  version: 0.1.0
  description: API contract for the SVG Piggies storefront and admin application.
servers:
  - url: /
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Check API health
      tags: [system]
      security: []
      responses:
        "200":
          description: The API process is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/admin/collections:
    get:
      operationId: getCollections
      summary: List collections
      tags: [admin-collections]
      security:
        - CloudflareAccess: []
      responses:
        "200":
          description: Collections ordered by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Collection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: createCollection
      summary: Create a collection
      tags: [admin-collections]
      security:
        - CloudflareAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCollectionInput"
      responses:
        "201":
          description: Collection created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/collections/{collectionId}:
    parameters:
      - $ref: "#/components/parameters/CollectionId"
    get:
      operationId: getCollection
      summary: Get a collection
      tags: [admin-collections]
      security:
        - CloudflareAccess: []
      responses:
        "200":
          description: Collection found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      operationId: updateCollection
      summary: Replace a collection
      tags: [admin-collections]
      security:
        - CloudflareAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCollectionInput"
      responses:
        "200":
          description: Collection updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      operationId: deleteCollection
      summary: Delete a collection
      tags: [admin-collections]
      security:
        - CloudflareAccess: []
      responses:
        "204":
          description: Collection deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/products/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        description: Product slug.
        schema:
          type: string
    get:
      operationId: getProductBySlug
      summary: Get a product by slug
      tags: [products]
      responses:
        "200":
          description: Product found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/products:
    get:
      operationId: getProducts
      summary: List products
      tags: [admin-products]
      security:
        - CloudflareAccess: []
      responses:
        "200":
          description: Products ordered by creation date, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: createProduct
      summary: Create a product
      tags: [admin-products]
      security:
        - CloudflareAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductInput"
      responses:
        "201":
          description: Product created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/products/{productId}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      operationId: getProduct
      summary: Get a product
      tags: [admin-products]
      security:
        - CloudflareAccess: []
      responses:
        "200":
          description: Product found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      operationId: updateProduct
      summary: Replace a product
      tags: [admin-products]
      security:
        - CloudflareAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductInput"
      responses:
        "200":
          description: Product updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      operationId: deleteProduct
      summary: Delete a product
      tags: [admin-products]
      security:
        - CloudflareAccess: []
      responses:
        "204":
          description: Product deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/products/{productId}/collections:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      operationId: getProductCollections
      summary: List a product's collection assignments
      tags: [admin-product-collections]
      security:
        - CloudflareAccess: []
      responses:
        "200":
          description: Collection assignments for the product.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: createProductCollection
      summary: Assign a product to a collection
      tags: [admin-product-collections]
      security:
        - CloudflareAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductCollectionInput"
      responses:
        "201":
          description: Product assigned to the collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/products/{productId}/collections/{collectionId}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
      - $ref: "#/components/parameters/CollectionId"
    delete:
      operationId: deleteProductCollection
      summary: Remove a product from a collection
      tags: [admin-product-collections]
      security:
        - CloudflareAccess: []
      responses:
        "204":
          description: Product removed from the collection.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/products/{productId}/product-types:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      operationId: getProductProductTypes
      summary: List a product's product type assignments
      tags: [admin-product-product-types]
      security:
        - CloudflareAccess: []
      responses:
        "200":
          description: Product type assignments for the product.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductProductType"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: createProductProductType
      summary: Assign a product type to a product
      tags: [admin-product-product-types]
      security:
        - CloudflareAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductProductTypeInput"
      responses:
        "201":
          description: Product type assigned to the product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductProductType"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/products/{productId}/product-types/{productTypeId}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
      - $ref: "#/components/parameters/ProductTypeId"
    delete:
      operationId: deleteProductProductType
      summary: Remove a product type from a product
      tags: [admin-product-product-types]
      security:
        - CloudflareAccess: []
      responses:
        "204":
          description: Product type removed from the product.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/product-types:
    get:
      operationId: getProductTypes
      summary: List product types
      tags: [admin-product-types]
      security:
        - CloudflareAccess: []
      responses:
        "200":
          description: Product types ordered by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: createProductType
      summary: Create a product type
      tags: [admin-product-types]
      security:
        - CloudflareAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductTypeInput"
      responses:
        "201":
          description: Product type created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductType"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/product-types/{productTypeId}:
    parameters:
      - $ref: "#/components/parameters/ProductTypeId"
    get:
      operationId: getProductType
      summary: Get a product type
      tags: [admin-product-types]
      security:
        - CloudflareAccess: []
      responses:
        "200":
          description: Product type found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductType"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      operationId: updateProductType
      summary: Replace a product type
      tags: [admin-product-types]
      security:
        - CloudflareAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductTypeInput"
      responses:
        "200":
          description: Product type updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductType"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      operationId: deleteProductType
      summary: Delete a product type
      tags: [admin-product-types]
      security:
        - CloudflareAccess: []
      responses:
        "204":
          description: Product type deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    CloudflareAccess:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: Cloudflare Access application JWT, validated using the team JWKS.

  parameters:
    CollectionId:
      name: collectionId
      in: path
      required: true
      description: Collection UUID.
      schema:
        type: string
        format: uuid
    ProductId:
      name: productId
      in: path
      required: true
      description: Product UUID.
      schema:
        type: string
        format: uuid
    ProductTypeId:
      name: productTypeId
      in: path
      required: true
      description: Product type UUID.
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Cloudflare Access authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The requested change conflicts with an existing record.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: The server could not complete the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [environment, status]
      properties:
        environment:
          type: string
        status:
          type: string
          enum: [ok]

    Collection:
      type: object
      required: [id, name, slug, description]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string

    CreateCollectionInput:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        description:
          type: string
          default: ""

    UpdateCollectionInput:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        description:
          type: string
          default: ""

    ProductStatus:
      type: string
      enum: [draft, active, archived]

    Product:
      type: object
      required: [id, title, slug, description, price, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        price:
          type: string
          pattern: '^(0|[0-9]{1,10})(\.[0-9]{1,2})?$'
          example: "19.95"
        status:
          $ref: "#/components/schemas/ProductStatus"
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    CreateProductInput:
      type: object
      required: [title, slug, price]
      properties:
        title:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        description:
          type: string
          default: ""
        price:
          type: string
          pattern: '^(0|[0-9]{1,10})(\.[0-9]{1,2})?$'
          example: "19.95"
        status:
          allOf:
            - $ref: "#/components/schemas/ProductStatus"
          default: draft

    UpdateProductInput:
      type: object
      required: [title, slug, price, status]
      properties:
        title:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        description:
          type: string
          default: ""
        price:
          type: string
          pattern: '^(0|[0-9]{1,10})(\.[0-9]{1,2})?$'
          example: "19.95"
        status:
          $ref: "#/components/schemas/ProductStatus"

    ProductCollection:
      type: object
      required: [productId, collectionId]
      properties:
        productId:
          type: string
          format: uuid
        collectionId:
          type: string
          format: uuid

    CreateProductCollectionInput:
      type: object
      required: [collectionId]
      properties:
        collectionId:
          type: string
          format: uuid

    ProductProductType:
      type: object
      required: [productId, productTypeId]
      properties:
        productId:
          type: string
          format: uuid
        productTypeId:
          type: string
          format: uuid

    CreateProductProductTypeInput:
      type: object
      required: [productTypeId]
      properties:
        productTypeId:
          type: string
          format: uuid

    ProductType:
      type: object
      required: [id, name, slug, description]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string

    CreateProductTypeInput:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        description:
          type: string
          default: ""

    UpdateProductTypeInput:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        description:
          type: string
          default: ""

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - invalid_request
            - unauthorized
            - not_found
            - conflict
            - internal_error
        message:
          type: string
