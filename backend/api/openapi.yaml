        relatedProductIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid

    ProductWithRelationships:
      type: object
      required: [product, relationships]
      properties:
        product:
          $ref: "#/components/schemas/Product"
        relationships:
          type: array
          items:
            $ref: "#/components/schemas/PopulatedProductRelationship"

    PopulatedProductRelationship:
      type: object
